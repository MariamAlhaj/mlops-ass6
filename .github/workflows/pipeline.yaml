name: CI/CD Pipeline with Resource Governance

on:
  push:
    branches:
      - master
      - develop
      - feature/*
  pull_request:
    branches:
      - master

jobs:
  # Lightweight linter job - always runs first
  linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install linter dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint flake8 black
      
      - name: Run linter
        run: |
          # Create a dummy Python file if none exists (for demo purposes)
          if [ ! -f "*.py" ]; then
            echo "# Test file" > test.py
          fi
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          pylint *.py --fail-under=7.0 || echo "Linting issues found but continuing"
      
      - name: Linter result
        run: echo "Linter job completed"

  # Expensive GPU training job - runs only under strict conditions
  train:
    runs-on: ubuntu-latest  # Use 'gpu-runner' in production
    needs: [linter]
    if: |
      success() &&
      github.ref == 'refs/heads/master' && 
      contains(github.event.head_commit.message, '[run-train]')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python and GPU dependencies
        run: |
          echo "Setting up GPU environment..."
          # Simulate GPU setup
          python -m pip install --upgrade pip
          pip install torch tensorflow numpy
      
      - name: Simulate expensive training
        run: |
          echo "Starting GPU-accelerated training..."
          echo "Training on master branch with explicit approval"
          python failing_train.py
      
      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            model.pkl
            training_metrics.json
      
      # Step that only runs on failure
      - name: Capture error logs on failure
        if: failure()
        run: |
          echo "Training failed - capturing error logs..."
          echo "Error timestamp: $(date)" > error_logs.txt
          echo "Branch: ${{ github.ref_name }}" >> error_logs.txt
          echo "Commit: ${{ github.sha }}" >> error_logs.txt
          echo "Commit message: ${{ github.event.head_commit.message }}" >> error_logs.txt
          echo "Job URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> error_logs.txt
          echo "" >> error_logs.txt
          echo "=== System Information ===" >> error_logs.txt
          lscpu >> error_logs.txt 2>&1 || echo "lscpu not available" >> error_logs.txt
          echo "" >> error_logs.txt
          echo "=== Memory Info ===" >> error_logs.txt
          free -h >> error_logs.txt 2>&1 || echo "free not available" >> error_logs.txt
          echo "" >> error_logs.txt
          echo "=== Recent Logs ===" >> error_logs.txt
          journalctl -n 50 >> error_logs.txt 2>&1 || echo "journalctl not available" >> error_logs.txt
      
      - name: Upload error logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs
          path: error_logs.txt
          retention-days: 7
      
      # Final cleanup step that always runs
      - name: Cleanup temporary cloud volumes
        if: always()
        run: |
          echo "Cleaning up temporary cloud volumes..."
          # Simulate cloud volume cleanup
          rm -rf /tmp/training_cache 2>/dev/null || echo "No temp files found"
          echo "Cleanup completed for ${{ github.run_id }}"

  # Final notification and cleanup step that runs regardless
  cleanup:
    runs-on: ubuntu-latest
    needs: [linter, train]
    if: always()
    steps:
      - name: Final cleanup and notification
        run: |
          echo "========================================="
          echo "Cleaning up temporary cloud volumes..."
          echo "========================================="
          echo "Pipeline completed for commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Train job status: ${{ needs.train.result }}"
